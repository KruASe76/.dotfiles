model = "gpt-6-luna"
model_reasoning_effort = "medium"
personality = "pragmatic"

approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
hooks = true
memories = true
prevent_idle_sleep = true
daemon_auto_start = false

[tui]
status_line = ["current-dir", "git-branch", "model-with-reasoning", "run-state", "task-progress", "five-hour-limit", "weekly-limit", "context-remaining"]
status_line_use_colors = true
theme = "monokai-spectrum"
session_picker_view = "comfortable"
screen_reader_detection_done = true
fullscreen_transcript = false

[tui.keymap.composer]
queue = "alt-q"

[tui.keymap.editor]
move_line_end = "end"

[tui.keymap.global]
open_external_editor = "ctrl-e"

[tui.model_availability_nux]
"gpt-5.5" = 4
gpt-6-astra = 2
"gpt-6.1-sol" = 4

[notice]
fast_default_opt_out = true

[tools.update_plan]
enabled = true

[mcp_servers.cavemem]
command = "/home/kruase/.local/share/fnm/node-versions/v24.15.0/installation/bin/node"
args = [
    "/home/kruase/.local/share/fnm/node-versions/v24.15.0/installation/lib/node_modules/cavemem/dist/index.js",
    "mcp"
]

[mcp_servers.context7]
command = "caveman-shrink"
args = [
    "context7-mcp",
]

[mcp_servers.serena]
command = "caveman-shrink"
args = [
    "serena",
    "start-mcp-server",
    "--project-from-cwd",
    "--context=codex",
]
startup_timeout_sec = 20

[mcp_servers.serena.tools.write_memory]
approval_mode = "approve"

[mcp_servers.serena.tools.replace_content]
approval_mode = "approve"

[mcp_servers.serena.tools.insert_after_symbol]
approval_mode = "approve"

[mcp_servers.serena.tools.replace_symbol_body]
approval_mode = "approve"

[mcp_servers."chrome-devtools"]
command = "caveman-shrink"
args = [
    "chrome-devtools-mcp",
]

[mcp_servers.playwright]
command = "caveman-shrink"
args = [
    "playwright-mcp",
]

[mcp_servers.fetch]
command = "caveman-shrink"
args = [
    "mcp-fetch-server",
]

[mcp_servers.sequentialthinking]
command = "caveman-shrink"
args = [
    "mcp-server-sequential-thinking",
]

[mcp_servers.filesystem]
command = "caveman-shrink"
args = [
    "mcp-server-filesystem",
    "/home/kruase/projects",
]

[mcp_servers.mcpls]
command = "mcpls"
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60

